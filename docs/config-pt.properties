description=Este modelo ontológico formaliza e melhora a descrição de metadados em torno de corpora. Designado CAO_CRM, implementa -- como um subconjunto delimitado e composto de CIDOC CRM e das suas extensões LRMoo e CRMdig -- o modelo concetual discutido e esquematizado por Mélanie Bouland no Consórcio Huma-Num ARIANE. Esta codificação RDF/OWL é uma implementação nova e independente, distinta do ficheiro originalmente entregue por Mélanie Bouland: foi construída com a ferramenta ROBOT (extração modular, http://robot.obolibrary.org/), submetida ao motor de inferência OWL HermiT (http://www.hermit-reasoner.com/), verificada com base em restrições SHACL, e validada visualmente no Protégé (https://protege.stanford.edu/), sendo depois reverificada por meio de uma cadeia de três auditorias independentes e sucessivas.
