abstract=Esta versão (1.0, publicada a 8 de julho de 2026) de CAO_CRM é uma recodificação completa, em RDF/OWL, do modelo concetual discutido e esquematizado originalmente por Mélanie Bouland no Consórcio Huma-Num ARIANE. A codificação foi realizada de forma independente por Andrés Echavarría Peláez, para o projeto AMIS, seguindo um método reprodutível: o conjunto exato de classes e propriedades necessárias foi extraído das versões oficiais de CIDOC CRM 7.1.3, LRMoo 1.1.1 e CRMdig 5.0 com a ferramenta ROBOT, numa única operação combinada para preservar as relações que atravessam as três ontologias no âmbito delimitado. O resultado foi submetido ao motor de inferência OWL HermiT para confirmar a sua consistência lógica, validado com base em restrições SHACL, e verificado visualmente no Protégé, sendo depois reverificado por meio de uma cadeia de três auditorias independentes e sucessivas.
