description=Acest model ontologic formalizează și îmbunătățește descrierea metadatelor specifice corpusurilor. Numit CAO_CRM, modelul de față implementează -- ca subset delimitat și compus din CIDOC CRM și din extensiile acestuia, LRMoo și CRMdig -- modelul conceptual discutat și schematizat de Dr. Mélanie Bouland în cadrul Consorțiului Huma-Num ARIANE. Această codare RDF/OWL în particular este o implementare nouă și independentă, distinctă de fișierul livrat inițial de Doamna Bouland: a fost construită cu instrumentul ROBOT (extracție de modul, http://robot.obolibrary.org/), a fost supusă raționatorului OWL HermiT (http://www.hermit-reasoner.com/), a fost verificată prin raportare la restricțiile SHACL, și a fost validată vizual în Protégé (https://protege.stanford.edu/), iar apoi reverificată printr-un lanț de trei audituri independente și succesive.
