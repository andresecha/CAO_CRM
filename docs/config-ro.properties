abstract=Această versiune (1.0, publicată pe 8 iulie 2026) a CAO_CRM este o recodare completă, în RDF/OWL, a modelului conceptual discutat și schematizat inițial de Dr. Mélanie Bouland în cadrul Consorțiului Huma-Num ARIANE. Codarea a fost realizată independent de Dr. Andrés Echavarría Peláez, pentru proiectul AMIS, urmând o metodă reproductibilă: setul exact de clase și proprietăți necesare a fost extras din versiunile oficiale ale CIDOC CRM 7.1.3, LRMoo 1.1.1 și CRMdig 5.0 cu instrumentul ROBOT, într-o singură trecere combinată în vederea păstrării relațiilor comune celor trei ontologii în perimetrul ales. Rezultatul a fost supus raționatorului OWL HermiT pentru a-i confirma consistența logică, a fost validat prin raportare la restricțiile SHACL, și a fost verificat vizual în Protégé, iar apoi reverificat printr-un lanț de trei audituri independente și succesive.
