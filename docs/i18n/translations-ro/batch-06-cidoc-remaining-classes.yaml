# Lote 6 (ro): las 18 clases CIDOC-CRM restantes del módulo (identidad, tipo, dimensión,
# tiempo/lugar, derechos, eventos biológicos). Ninguna tiene etiqueta oficial en rumano; se
# completan label + comment para las 18. E3_Condition_State usa "Stare materială" (ver nota en
# glossary_crosswalk-ro.yaml -- se prefiere fidelidad al fr oficial "État matériel" sobre el
# "Estado de conservación" del es, dado que el comentario EN completo define un estado físico
# general, no necesariamente de conservación patrimonial).

terms:
  - iri: "http://www.cidoc-crm.org/cidoc-crm/E41_Appellation"
    local_name: E41_Appellation
    label: {ro: "Denumire"}
    comment:
      ro: >-
        Această clasă cuprinde toate semnele, semnificative sau nu, sau aranjamentele de semne care
        urmează o sintaxă specifică, folosite sau care pot fi folosite pentru a se referi la și a
        identifica o anumită instanță a unei clase, într-un context dat. E41_Denumire nu identifică
        lucrurile prin semnificația lor, chiar dacă întâmplător au una, ci prin convenție, tradiție
        sau înțelegere. Instanțele de „denumire” sunt construcții culturale; ca atare, ele au un
        context, o istorie și o utilizare în timp și spațiu proprii unui anumit grup de utilizatori.
        O anumită instanță de „denumire” poate avea forme alternative, adică alte instanțe de
        E41_Denumire considerate echivalente, indiferent de lucrul pe care îl denotă. Limbi diferite
        pot folosi denumiri diferite pentru același lucru, precum numele marilor orașe. Unele
        denumiri pot fi formulate printr-o sintagmă nominală validă a unei anumite limbi. În aceste
        cazuri, aceste instanțe de denumire trebuie declarate de asemenea ca instanțe de
        E33_Obiect_lingvistic. Limba care folosește denumirea poate fi atunci declarată, folosind
        proprietatea P72_are_limbă, ca E56_Limbă. Instanțele E41_Denumire pot fi folosite pentru a
        identifica orice instanță de E1_Entitate_CRM și sunt uneori caracteristice pentru instanțe
        ale unor subclase mai specifice ale entității CRM, precum instanțele de
        E52_Interval_temporal” (de exemplu, datele unui congres), E39_Actant, E53_Loc sau
        E28_Obiect_conceptual. Adresele poștale și adresele de e-mail sunt exemple caracteristice de
        identificatori folosiți de serviciile care transportă lucruri între clienți. Chiar și
        identificatorii exprimați numeric pentru întinderi în spațiu sau timp sunt de asemenea
        considerați instanțe de denumiri, precum datele calendarului gregorian sau coordonatele
        spațiale, chiar dacă acestea permit determinarea unui moment sau a unui loc printr-o
        procedură cunoscută, pornind de la un punct de referință, jucând astfel un rol dublu, ca
        instanțe de E59_Valoare_primitivă. E41_Denumire (convențională) nu trebuie confundată cu
        actul de a atribui un nume/ identificator. Cf. E15_Atribuire_de_identificator.

  - iri: "http://www.cidoc-crm.org/cidoc-crm/E42_Identifier"
    local_name: E42_Identifier
    label: {ro: "Identificator"}
    comment:
      ro: >-
        Această clasă, E42_Identificator, cuprinde șirurile de caractere sau codurile atribuite
        instanțelor de E1_Entitate_CRM pentru a le identifica în mod unic și permanent în contextul
        uneia sau mai multor organizații. Astfel de coduri sunt adesea numite numere de inventar,
        coduri de înregistrare etc. și sunt de regulă alcătuite din secvențe alfanumerice. Adresele
        poștale, numerele de telefon, URL-urile și adresele de e-mail sunt exemple caracteristice de
        identificatori folosiți de serviciile care transportă lucruri între clienți. Clasa
        E42_Identificator nu se folosește în mod normal pentru identificatori generați automat,
        utilizați pentru prelucrare automatizată, cu excepția cazului în care aceștia sunt folosiți
        și de agenți umani.

  - iri: "http://www.cidoc-crm.org/cidoc-crm/E35_Title"
    local_name: E35_Title
    label: {ro: "Titlu"}
    comment:
      ro: >-
        Această clasă cuprinde șirurile textuale care, într-un context cultural dat, pot fi
        identificate clar drept titluri datorită formei lor. Fiind o subclasă a lui E41_Denumire,
        E35_Titlu poate fi folosită doar atunci când un asemenea șir este folosit efectiv ca titlu
        al unei lucrări, precum un text, o operă de artă sau o piesă muzicală. Titlurile sunt
        sintagme nominale proprii sau sintagme verbale și nu trebuie confundate cu denumiri generice
        de obiecte, precum „scaun”, „pictură” sau „carte” (acestea din urmă fiind substantive comune
        care corespund unor instanțe de E55_Tip). Titlurile pot fi atribuite de însuși creatorul
        lucrării sau de un grup social. Această clasă cuprinde de asemenea traducerile titlurilor
        folosite ca substitute ale titlurilor originale în contexte sociale diferite.

  - iri: "http://www.cidoc-crm.org/cidoc-crm/E55_Type"
    local_name: E55_Type
    label: {ro: "Tip"}
    comment:
      ro: >-
        Această clasă, E55_Tip, cuprinde concepte desemnate prin termeni din tezaure și vocabulare
        controlate, folosite pentru a caracteriza și clasifica instanțele claselor CIDOC CRM.
        Instanțele de E55_Tip reprezintă concepte, spre deosebire de instanțele de E41_Denumire,
        care servesc la denumirea instanțelor claselor CIDOC CRM. E55_Tip oferă o interfață către
        ontologii și tezaure specifice unui domeniu. Ontologiile și tezaurele pot fi reprezentate în
        CIDOC CRM ca subclase ale E55_Tip, sub forma unor ierarhii de termeni, adică de instanțe
        E55_Tip legate prin proprietatea P127_are_drept_termen_generic (are termen specific). Astfel
        de ierarhii pot fi extinse cu proprietăți suplimentare.

  - iri: "http://www.cidoc-crm.org/cidoc-crm/E54_Dimension"
    local_name: E54_Dimension
    label: {ro: "Dimensiune"}
    comment:
      ro: >-
        Această clasă, E54_Dimensiune, cuprinde proprietăți cuantificabile care pot fi măsurate prin
        anumite mijloace-etalon și pot fi aproximate prin valori, adică puncte sau regiuni într-un
        spațiu matematic sau conceptual, precum numere naturale sau reale, valori RGB etc. O
        instanță de E54_Dimensiune reprezintă mărimea obținută empiric sau derivată teoretic,
        incluzând toleranțele de precizie rezultate din metoda sau calculul particular folosite.
        Identitatea unei instanțe de dimensiune depinde de metoda determinării sale, deoarece
        fiecare metodă poate produce valori diferite chiar și atunci când se determină mărimi
        comparabile. De exemplu, anvergura aceleiași păsări vii sau moarte rezultă în dimensiuni
        diferite. Metodele de datare prin termoluminiscență sau prin rehidroxilare [RHX] produc
        dimensiuni diferite ale distanței temporale față de prezent, chiar dacă ambele urmăresc
        datarea aceluiași obiect. Metoda de determinare trebuie exprimată prin proprietatea
        P2_are_ca_tip (este tip de). Rețineți că termeni simpli precum „diametru” sau „lungime” sunt
        de regulă insuficienți pentru a descrie fără ambiguitate o anumită dimensiune. În schimb,
        „întinderea liniară maximă” poate fi suficientă. Proprietățile clasei E54_Dimensiune permit
        exprimarea aproximării numerice a valorilor instanțelor de dimensiune, adecvată preciziei
        metodei de determinare aplicate. Dacă mărimea respectivă aparține unui spațiu necontinuu
        conform legilor fizicii, precum distanțele spațiale, se recomandă înregistrarea lor ca
        aproximări prin intervale sau regiuni de nedeterminare care includ valorile adevărate
        presupuse. De exemplu, o lungime de 5 cm poate fi înregistrată ca 4,5-5,5 cm, în funcție de
        precizia observației respective. Rețineți că posibilitatea de a compara valori exprimate în
        unități diferite depinde în mod critic de reprezentarea lor ca regiuni de valori.
        Aproximările numerice aparținând sistemelor arhaice de E58_Unitate_de_măsură folosite în
        înregistrările istorice trebuie păstrate. Echivalentele corespunzătoare cunoștințelor
        actuale trebuie înregistrate ca instanțe suplimentare de dimensiune, după caz.

  - iri: "http://www.cidoc-crm.org/cidoc-crm/E58_Measurement_Unit"
    local_name: E58_Measurement_Unit
    label: {ro: "Unitate de măsură"}
    comment:
      ro: >-
        Această clasă, E58_Unitate_de_măsură, este o specializare a E55_Tip și cuprinde tipurile de
        unități de măsură: picioare, țoli, centimetri, litri, lumeni etc. Acest tip este folosit în
        mod categoric în model, fără referire la instanțe proprii, adică modelul nu prevede
        descrierea unor instanțe ale instanțelor de E58_Unitate_de_măsură, precum „instanțe de cm”.
        Ori de câte ori este posibil, trebuie folosite unități ale Sistemului Internațional (SI) sau
        termeni recunoscuți la nivel internațional din afara SI, precum cei definiți de ISO
        80000:2009. Unitățile de măsură arhaice folosite în înregistrările istorice trebuie
        păstrate.

  - iri: "http://www.cidoc-crm.org/cidoc-crm/E57_Material"
    local_name: E57_Material
    label: {ro: "Material"}
    comment:
      ro: >-
        Această clasă, E57_Material, este o specializare a E55_Tip și cuprinde conceptele de
        materiale. Instanțele de E57_Material pot desemna proprietăți ale materiei înainte de
        utilizarea sa, în timpul utilizării sale, și odată încorporată într-un obiect, precum pudra
        de ultramarin, pasta de tempera sau betonul armat. Piesele discrete de materii prime
        păstrate în muzee, precum cărămizi, bucăți de material textil sau fragmente de metal,
        trebuie modelate individual, în același mod ca și celelalte obiecte. Fragmentele discrete
        folosite sau prelucrate, precum pietrele din templul Nefertitei, trebuie modelate ca părți
        (cf. P46_este_compus_din (face parte din) E18_lucru_material). Acest tip este folosit în mod
        categoric în model, fără referire la instanțe proprii, adică modelul nu prevede descrierea
        unor instanțe ale instanțelor de E57_Material, precum „instanțe de aur”. Pentru un astfel de
        exemplu (e.g. „aur”), se recomandă folosirea unor coduri și a unei terminologii recunoscute
        la nivel internațional sau național.

  - iri: "http://www.cidoc-crm.org/cidoc-crm/E56_Language"
    local_name: E56_Language
    label: {ro: "Limbă"}
    comment:
      ro: >-
        Această clasă, E56_Limbă, este o specializare a E55_Tip și cuprinde limbile naturale, în
        sensul de concepte. Acest tip este folosit în mod categoric în model, fără referire la
        instanțe proprii, adică modelul nu prevede descrierea unor instanțe ale instanțelor de
        E56_Limbă, precum „instanțe de mandarină”. Pentru astfel de exemple (e.g. limba mandarină),
        se recomandă folosirea, pentru a desemna instanțele de E56_Limbă, a unor coduri și a unei
        terminologii recunoscute la nivel internațional sau național, precum cele definite în ISO
        639-3:2007 și versiunile ulterioare.

  - iri: "http://www.cidoc-crm.org/cidoc-crm/E33_Linguistic_Object"
    local_name: E33_Linguistic_Object
    label: {ro: "Obiect lingvistic"}
    comment:
      ro: >-
        Această clasă cuprinde expresii identificabile într-o limbă naturală sau în mai multe limbi
        naturale. Instanțele de E33_Obiect_lingvistic pot fi exprimate în multe moduri: de exemplu,
        ca texte scrise, vorbire înregistrată sau limbaj al semnelor. Totuși, CIDOC CRM tratează
        instanțele de E33_Obiect_lingvistic independent de mediul sau de metoda prin care sunt
        exprimate. Expresiile în limbaje formale, precum codul informatic sau formulele matematice,
        nu sunt tratate de CIDOC CRM ca instanțe de E33_Obiect_lingvistic. Acestea trebuie modelate
        ca instanțe de E73_Obiect_informatic. În general, o instanță de E33_Obiect_lingvistic poate
        conține de asemenea informații non-lingvistice, adesea cu valoare artistică sau estetică.
        Doar în cazurile în care conținutul unei instanțe de E33_Obiect_lingvistic poate fi exprimat
        integral printr-o serie de simboluri codificate binar, conținutul său poate fi documentat,
        în cadrul unei baze de cunoștințe date și cu ajutorul proprietății
        P190_are_conținut_simbolic, drept E62_Șir_de_caractere. În caz contrar, trebuie înțeles ca o
        resursă digitală identificabilă, disponibilă doar independent de baza de cunoștințe
        respectivă. În alte cazuri, precum paginile unui manuscris iluminat sau înregistrări care
        conțin vorbire într-o limbă care dispune de un sistem de scriere, partea lingvistică a
        conținutului unei instanțe de E33_Obiect_lingvistic poate fi documentată, în cadrul unei
        baze de cunoștințe date și prin intermediul proprietății P3_are_notă, drept
        E62_Șir_de_caractere. În caz contrar, poate fi descrisă cu ajutorul proprietății
        P165_încorporează (este încorporat în) drept E73_Obiect_informatic, așadar ca un obiect
        diferit, cu propria sa identitate.

  - iri: "http://www.cidoc-crm.org/cidoc-crm/E3_Condition_State"
    local_name: E3_Condition_State
    label: {ro: "Stare materială"}
    comment:
      ro: >-
        Această clasă cuprinde stările obiectelor caracterizate printr-o anumită stare pe parcursul
        unui interval de timp. O instanță a E3_Stare_materială descrie starea materială predominantă
        a oricărui obiect material sau a oricărei trăsături fizice în cursul unei anumite instanțe
        de E52_Interval_temporal. În general, intervalul de timp pentru care poate fi afirmată o
        anumită stare poate fi mai scurt decât intervalul de timp real în care această stare a fost
        efectiv valabilă. Natura acestei stări poate fi descrisă prin intermediul proprietății
        P2_are_ca_tip. Un exemplu de instanță E3_Stare materială: „starea SS Great Britain între 22
        septembrie 1846 și 27 august 1847” poate fi caracterizată ca o instanță „naufragiat” a
        E55_Tip.

  - iri: "http://www.cidoc-crm.org/cidoc-crm/E53_Place"
    local_name: E53_Place
    label: {ro: "Loc"}
    comment:
      ro: >-
        Această clasă, E53_Loc, cuprinde întinderi din spațiul natural în care trăiesc oamenii, în
        special pe suprafața Pământului, în sensul pur fizic al termenului: independent de
        fenomenele temporale și de materie. Ele pot servi la descrierea locației fizice a lucrurilor
        sau a fenomenelor, ori a altor zone de interes. Din punct de vedere geometric, instanțele de
        E53_Loc constituie zone contigue unice sau o agregare finită de zone disjuncte în spațiu,
        fiecare fiind, la rândul ei, contiguă. Ele pot avea limite neclare. Instanțele de E53_Loc
        sunt de regulă determinate prin raportare la poziția unor obiecte „imobile”, precum clădiri,
        orașe, munți, râuri sau repere geodezice dedicate, dar pot fi determinate și prin raportare
        la obiecte mobile. Un loc poate fi determinat prin combinarea unui cadru de referință și a
        unei poziții în raport cu acest cadru. Se susține uneori că instanțele de E53_Loc sunt cel
        mai bine identificate prin coordonate globale sau sisteme de referință absolute. Totuși,
        referințele relative sunt adesea mai relevante în contextul documentării culturale și tind
        să fie mai precise. În special, oamenii sunt adesea interesați de poziția în raport cu
        obiecte mari, mobile, precum navele. De exemplu, locul în care a murit Nelson este cunoscut
        prin raportare la un obiect mare, mobil, și anume H.M.S. Victory. O rezolvare a acestui loc
        în termeni de coordonate absolute ar necesita cunoașterea mișcărilor navei și a momentului
        precis al decesului, ambele putând fi revizuite, iar rezultatul ar fi lipsit de relevanță
        istorică și culturală. Orice instanță de E18_Lucru_material poate servi drept cadru de
        referință pentru o instanță de E53_Loc. Acest lucru poate fi documentat utilizând
        proprietatea P157_este_în repaus_relativ_față_de (oferă spațiul de referință pentru).

  - iri: "http://www.cidoc-crm.org/cidoc-crm/E52_Time-Span"
    local_name: "E52_Time-Span"
    label: {ro: "Interval temporal"}
    comment:
      ro: >-
        Această clasă cuprinde secvențe temporale abstracte, în sensul fizicii galileene, având un
        început, un sfârșit și o durată. Instanțele de E52_Interval_temporal” nu au nicio conotație
        semantică privind fenomenele care se produc în cadrul întinderii temporale pe care o
        reprezintă. Ele nu transmit niciun sens în afara unei poziționări pe „linia timpului” a
        cronologiei. Întinderea efectivă a unei instanțe de E52_Interval_temporal poate fi
        aproximată prin proprietăți ale E52_Interval_temporal care oferă limite interioare și
        exterioare sub formă de date (instanțe de E61_Primitivă_temporală). Compararea cunoștințelor
        privind intervalele temporale este fundamentală pentru raționamentul cronologic. Unele
        instanțe de E52_Interval_temporal pot fi definite drept întinderea temporală reală, în
        principiu observabilă, a instanțelor de E2_Entitate_temporală, folosind proprietatea
        P4_are_interval_temporal (este intervalul temporal al). Acestea constituie intervale
        temporale fenomenale, așa cum sunt definite în CRMgeo (Doerr & Hiebel 2013). Deoarece
        cunoștințele noastre despre istorie sunt imperfecte, iar fenomenele fizice sunt neclare prin
        natura lor, întinderea intervalelor temporale fenomenale poate fi descrisă doar aproximativ.
        Un caz extrem de aproximare ar putea, de exemplu, defini o instanță de E52_Interval_temporal
        al cărei început, sfârșit și durată sunt necunoscute. Aceasta poate fi totuși asociată cu
        alte descrieri prin care se pot deduce cunoștințe despre ea, precum în cronologiile
        relative. Unele instanțe de E52 pot fi definite cu precizie ca reprezentând declararea unei
        întinderi temporale, așa cum se face, de exemplu, într-un contract comercial. Acestea
        constituie intervale temporale declarative, așa cum sunt definite în CRMgeo (Doerr & Hiebel
        2013), și pot fi descrise prin proprietatea P170_definește_timpul (timpul este definit de)”.
        Atunci când este folosit ca interval temporal comun pentru două evenimente, acesta le va
        descrie totuși ca fiind simultane, chiar dacă nu se cunoaște nimic altceva.

  - iri: "http://www.cidoc-crm.org/cidoc-crm/E30_Right"
    local_name: E30_Right
    label: {ro: "Drept"}
    comment:
      ro: >-
        Această clasă cuprinde privilegii juridice privind lucruri materiale și imateriale sau
        derivatele lor. E30_Drept include drepturile de reproducere și drepturile de proprietate.

  - iri: "http://www.cidoc-crm.org/cidoc-crm/E89_Propositional_Object"
    local_name: E89_Propositional_Object
    label: {ro: "Obiect propozițional"}
    comment:
      ro: >-
        Această clasă, E89_Obiect_propozițional, cuprinde elemente imateriale, incluzând, dar fără a
        se limita la, povești, intrigi, prescripții procedurale, algoritmi, legi ale fizicii sau
        imagini care sunt, sau reprezintă într-un anumit sens, ansambluri de propoziții despre
        lucruri reale sau imaginare și care sunt documentate ca unități unice sau servesc drept
        subiect de discurs. Această clasă cuprinde de asemenea elemente care sunt „despre” ceva, în
        sensul unui subiect. În sens larg, această clasă include expresii de valoare psihologică,
        precum arta non-figurativă și temele muzicale. Totuși, elementele conceptuale, precum
        tipurile și clasele, nu sunt instanțe de E89_Obiect_propozițional. Acest lucru nu trebuie
        confundat cu definiția unui tip, care este, într-adevăr, o instanță de E89 Obiect
        propozițional.

  - iri: "http://www.cidoc-crm.org/cidoc-crm/E90_Symbolic_Object"
    local_name: E90_Symbolic_Object
    label: {ro: "Obiect simbolic"}
    comment:
      ro: >-
        Această clasă, E90_Obiect_simbolic, cuprinde simboluri identificabile și orice agregare de
        simboluri, precum caractere, identificatori, semne de circulație, embleme, texte, seturi de
        date, imagini, partituri muzicale, obiecte multimedia, cod de program informatic sau formule
        matematice, care au o structură recognoscibilă în mod obiectiv și care sunt documentate ca
        unități unice. Include ansambluri de semne de orice natură, care pot servi la desemnarea a
        ceva, sau la comunicarea unui anumit conținut propozițional. O instanță de
        E90_Obiect_simbolic poate avea sau nu o semnificație specifică, de exemplu un șir de
        caractere arbitrar. În unele cazuri, conținutul unei instanțe de E90_Obiect_simbolic poate
        fi reprezentat integral printr-un model de conținut digital serializat, precum o secvență de
        caractere codificate ASCII, un document XML sau HTML, sau o imagine TIFF. Proprietatea
        P3_are_drept_notă și subproprietatea sa P190_are_conținut_simbolic permit descrierea acestui
        model de conținut. Pentru a elimina ambiguitatea privind nivelul simbolic purtător al
        semnificației, proprietatea P3.1_are_ca_tip poate fi folosită pentru a preciza codificarea
        (de exemplu „bit”, „caracter latin”, pixel RGB).

  - iri: "http://www.cidoc-crm.org/cidoc-crm/E12_Production"
    local_name: E12_Production
    label: {ro: "Proces de producție"}
    comment:
      ro: >-
        Această clasă cuprinde activități concepute pentru a crea efectiv unul sau mai multe
        elemente noi. E12_Proces_de_producție specializează noțiunea de modificare în cea de
        producție. Decizia dacă un obiect este sau nu considerat nou depinde de context. De regulă,
        obiectele sunt considerate „noi” dacă nu există nicio similitudine generală evidentă între
        ele, pe de o parte, și elementele consumate și materialul folosit în producerea acestora, pe
        de altă parte. În alte cazuri, un obiect este considerat „nou” pentru că o modificare îl
        face relevant pentru documentare. De exemplu, mâzgălirea unui nume pe un ciob de ceramică îl
        poate transforma într-un jeton de vot. Ciobul original poate să nu merite documentat, spre
        deosebire de cel inscripționat. Această entitate poate fi și colectivă: tipărirea a o mie de
        cărți, de exemplu, ar fi de regulă considerată un singur eveniment. Un eveniment trebuie de
        asemenea documentat printr-o instanță de E81_Transformare dacă are ca rezultat distrugerea
        unuia sau mai multor obiecte și, simultan, producerea altora folosind părți sau material din
        cele originale. În acest caz, noile elemente au identități separate: materia este păstrată,
        dar identitatea nu.

  - iri: "http://www.cidoc-crm.org/cidoc-crm/E67_Birth"
    local_name: E67_Birth
    label: {ro: "Naștere"}
    comment:
      ro: >-
        Această clasă, E67_Naștere, cuprinde nașterile ființelor umane. E67_Naștere este un
        eveniment biologic centrat pe contextul în care oamenii vin pe lume (de comparat cu
        E63_Început_al_existenței, care vizează venirea pe lume a oricărei ființe vii). Venirea pe
        lume a gemenilor, tripleților etc. este descrisă prin aceeași instanță de E67_Naștere.
        Introducerea evenimentului E67_Naștere ca element de documentare permite descrierea unei
        game de relații de familie printr-un model simplu. Extensii adecvate pot descrie în detaliu
        complexitatea maternității de la apariția medicinei moderne. În acest model, tatăl biologic
        nu este considerat un participant necesar la E67_Naștere.

  - iri: "http://www.cidoc-crm.org/cidoc-crm/E69_Death"
    local_name: E69_Death
    label: {ro: "Moarte"}
    comment:
      ro: >-
        Această clasă, E69_Moarte, cuprinde decesele ființelor umane. Dacă o persoană este ucisă,
        decesul acesteia trebuie instanțiat atât ca E69_Moarte, cât și ca E7_Activitate. Decesul sau
        dispariția altor ființe vii (altele decât ființele umane) trebuie documentate ca instanțe de
        E64_Sfârșit_al_existenței.
